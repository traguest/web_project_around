<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="page/index.css" />

    <meta name="author" content="javp" />
    <meta name="keywords" content="html,css,javascript" />
    <meta
      name="description"
      content="esto es una practica didactica de tripleten"
    />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__content">
          <img
            class="header__image"
            src="images/logo.png"
            alt="logo de tripleten"
          />
        </div>
      </header>

      <main class="menu">
        <section class="description">
          <div class="description__content">
            <img
              class="description__photo"
              src="images/viejo.jpg"
              alt="foto personal"
            />

            <div class="description__conteiner">
              <div class="description__capa">
                <h1 class="description__text">Jacques Cousteau</h1>
                <img
                  class="description__edit"
                  src="images/editor.png"
                  alt="editar"
                />
              </div>

              <span class="description__span">Explorador</span>
            </div>

            <button class="description__button">+</button>
          </div>
        </section>

        <section class="content">
          <div class="content__element"></div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer__content">
          <h3 class="footer__text">&copy; 2025 Jose Antonio V.P.</h3>
        </div>
      </footer>
    </div>

    <div class="modal">
      <div class="modal__container">
        <form name="modal" class="modal__content" action="." novalidate>
          <h3 class="modal__title">Agregar Bloque</h3>
          <div class="modal__close">X</div>
          <input
            name="modalInput"
            id="text-input"
            type="text"
            class="modal__text"
            placeholder="nombre"
            required
            minlength="2"
            maxlength="40"
          />
          <div class="modal__content-text">
            <span class="modal__text-input-error text-input-error"></span>
          </div>
          <input
            id="url-input"
            type="url"
            class="modal__text"
            placeholder="link"
            required
          />
          <div class="modal__content-text">
            <span class="modal__text-input-error url-input-error"></span>
          </div>

          <button class="modal__add">guardar</button>
        </form>
      </div>
    </div>

    <div class="add">
      <div class="add__container">
        <form class="form" action="." novalidate>
          <h3 class="add__title">Editar valor</h3>
          <div class="add__close">X</div>

          <input
            id="text-input"
            class="add__text"
            class="texto"
            type="text"
            placeholder="Nombre"
            required
            minlength="2"
            maxlength="40"
          />
          <div class="add__content">
            <span class="add__text-input-error text-input-error"></span>
          </div>

          <input
            id="profesion-input"
            class="add__text"
            type="text"
            placeholder="Profesion"
            required
            minlength="2"
            maxlength="200"
          />
          <div class="add__content">
            <span class="add__text-input-error profesion-input-error"></span>
          </div>

          <button class="add__save">guardar</button>
        </form>
      </div>
    </div>

    <div class="contentImage">
      <div class="contentImage__image">
        <img class="content__target-image" src="" alt="" />
        <p class="contentImage__text"></p>

        <p class="contentImage__close">X</p>
      </div>
    </div>

    <template class="template">
      <div class="content__target">
        <img class="content__target-image" src="" alt="" />
        <div class="content__capa">
          <p class="content__text"></p>
          <svg
            class="content__corazon"
            version="1.1"
            id="Capa_1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            x="0px"
            y="0px"
            viewBox="0 0 319.743 319.743"
            style="enable-background: new 0 0 319.743 319.743"
            xml:space="preserve"
          >
            <g>
              <g>
                <path
                  d="M160.968,301.675c-1.601,0-3.125-0.624-4.275-1.729c-0.252-0.24-26.244-25.388-130.22-129.355l-0.72-0.732 c-0.817-0.805-1.21-1.261-1.598-1.711C8.455,151.174,0,129.683,0,107.228c0-49.158,40.004-89.159,89.159-89.159 c28.076,0,53.89,12.919,70.713,34.975c16.825-22.062,42.646-34.975,70.712-34.975c49.168,0,89.159,40.001,89.159,89.159 c0,24.881-10.063,48-28.343,65.08c0.049,0.006-0.162,0.246-0.402,0.486c-104.621,104.609-125.341,126.72-125.542,126.923 c-1.132,1.214-2.693,1.916-4.335,1.958C161.072,301.675,161.01,301.675,160.968,301.675z"
                />
              </g>
            </g>
          </svg>

          <svg

              d="M295.76 146.62h-80.29a8 8 0 0 1-8-8v-45.7a9.73 9.73 0 0 1 9.72-9.71H294a9.73 9.73 0 0 1 9.72 9.71v45.7a8 8 0 0 1-7.96 8zm-72.29-16h64.29V99.21h-64.29zM304.26 196h-97.91a8 8 0 0 1 0-16h97.91a8 8 0 0 1 0 16zM256 378.71a8 8 0 0 1-8-8V253a8 8 0 0 1 16 0v117.71a8 8 0 0 1-8 8zm-40.54 0a8 8 0 0 1-7.94-7.1l-13.31-117.77a8 8 0 0 1 15.9-1.79l13.31 117.76a8 8 0 0 1-7 8.85c-.35.03-.66.05-.96.05zm80.54 0h-.91a8 8 0 0 1-7.05-8.85l13.31-117.76a8 8 0 0 1 15.9 1.79L304 371.61a8 8 0 0 1-8 7.1z"
            />
          </svg>

          <!-- <img class="content__image-delete" src="images/eliminar.png" alt="" />-->
        </div>
      </div>
    </template>

    <script src="scripts/index.js" type="module"></script>
  </body>
</html>
